[tool.poetry]
name = "vivia-ai"
version = "0.1.0"
description = "Vivia AI - Unsupervised ML Ecosystem"
authors = ["Aleosh"]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
google-cloud-storage = "^2.14.0"
mlflow = "^2.10.0"
pika = "^1.3.2"  # RabbitMQ client
pyjwt = "^2.8.0"  # Auth JWT del servicio LLM
httpx = "^0.27.0"  # Cliente HTTP async (llama-server)
sqlalchemy = {extras = ["asyncio"], version = "^2.0.0"}
asyncpg = "^0.29.0"
psutil = "^5.9.0"  # Métricas de RAM del proceso

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.4"
black = "^24.1.1"
ruff = "^0.2.0"
jupyter = "^1.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
