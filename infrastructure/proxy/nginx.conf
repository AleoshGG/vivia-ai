events {
    worker_connections 1024;
}

http {
    upstream anomaly_api {
        server anomaly-api:8001;
    }

    upstream clustering_batch {
        server clustering-batch:8002;
    }

    upstream llm_local {
        server llm-local:8003;
    }

    server {
        listen 80;
        server_name localhost;

        # Enrutamiento basado en prefijo
        location /api/anomaly/ {
            proxy_pass http://anomaly_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/clustering/ {
            proxy_pass http://clustering_batch;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/llm/ {
            proxy_pass http://llm_local;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Denegar acceso si falta header X-Internal-API-Key
        # (Esto también lo valida FastAPI, pero añadirlo aquí añade una capa extra)
        # TODO: Se puede usar auth_request en el futuro
    }
}
